<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="天気比較"><link rel="apple-touch-icon" href="./icon-512.png"><link rel="icon" type="image/png" href="./icon-512.png"><title>天気比較</title><style>body{font-family:-apple-system,sans-serif;background:#f4f7fb;color:#172033;margin:0}.w{max-width:900px;margin:auto;padding:20px}h1{margin-bottom:4px}.sub{color:#667085}.box,.card{background:white;border:1px solid #e4e9ef;border-radius:16px;padding:14px;margin:12px 0}.box{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:11px;border-radius:10px;border:1px solid #d5dce5}input[type=text]{flex:1;min-width:150px}button{background:#1677ff;color:white;border:0;font-weight:bold}.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px}.big{font-size:25px;font-weight:bold}.muted{color:#718096}.row{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;padding:11px 0;border-bottom:1px solid #edf0f4}.head{font-weight:bold}.copyrow{cursor:pointer;border-radius:10px;padding-left:6px;padding-right:6px}.copyrow:active{background:#eaf3ff}.copyhint{font-size:12px;color:#1677ff;margin:8px 0}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#172033;color:white;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.err{color:#b42318}@media(max-width:550px){.row{grid-template-columns:65px 1fr 1fr}.card{padding:11px}.big{font-size:21px}}</style></head><body><main class="w"><h1>今日と1年前の天気</h1><div class="sub">指定日から先の天気を、1年前と比較</div><div class="box"><input id="q" type="text" value="東京都" placeholder="地域"><input id="d" type="date"><button id="b">表示</button></div><div id="out"></div></main><div id="toast" class="toast">コピーしました</div><script>const $=x=>document.querySelector(x),out=$('#out');const W={0:'快晴',1:'晴れ',2:'一部曇り',3:'曇り',45:'霧',48:'霧',51:'弱い霧雨',53:'霧雨',55:'強い霧雨',61:'弱い雨',63:'雨',65:'強い雨',71:'弱い雪',73:'雪',75:'強い雪',80:'にわか雨',81:'にわか雨',82:'激しい雨',95:'雷雨',96:'雷雨',99:'激しい雷雨'};function iso(x){return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}function shift(s,n){let x=new Date(s+'T12:00:00');x.setDate(x.getDate()+n);return iso(x)}function year(s){let x=new Date(s+'T12:00:00');x.setFullYear(x.getFullYear()-1);return iso(x)}function fmt(s){return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',weekday:'short'}).format(new Date(s+'T12:00:00'))}function copyDate(s){let x=new Date(s+'T12:00:00');return (x.getMonth()+1)+'/'+x.getDate()}async function geo(q){let r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=1&language=ja&format=json'),j=await r.json();if(!j.results?.length)throw Error('地域が見つかりません');return j.results[0]}async function data(lat,lon,s,e){let today=iso(new Date()),base=e<today?'https://archive-api.open-meteo.com/v1/archive':'https://api.open-meteo.com/v1/forecast';let u=base+'?latitude='+lat+'&longitude='+lon+'&start_date='+s+'&end_date='+e+'&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=Asia%2FTokyo';let r=await fetch(u),j=await r.json();if(!j.daily)throw Error('取得できる予報期間を超えている可能性があります');return j.daily.time.map((d,i)=>({d,c:j.daily.weather_code[i],hi:j.daily.temperature_2m_max[i],lo:j.daily.temperature_2m_min[i],p:j.daily.precipitation_sum[i]}))}function card(x,t){return '<div class="card"><div class="muted">'+t+'</div><b>'+fmt(x.d)+'</b><div class="big">'+(W[x.c]||'-')+'</div><div class="big">'+x.hi+'℃ <span class="muted">/ '+x.lo+'℃</span></div><div class="muted">降水量 '+x.p+'mm</div></div>'}async function copyText(t){try{await navigator.clipboard.writeText(t)}catch(e){let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}let z=$('#toast');z.classList.add('show');setTimeout(()=>z.classList.remove('show'),1200)}async function go(){try{out.innerHTML='<div class="card">読み込み中…</div>';let d=$('#d').value,g=await geo($('#q').value),s=d,e=shift(d,20),ps=year(s),pe=year(e);let [a,z]=await Promise.all([data(g.latitude,g.longitude,s,e),data(g.latitude,g.longitude,ps,pe)]);let x=a[0],y=z[0];if(!x||!y)throw Error('選択日のデータがありません');let rows=a.map(v=>{let p=z.find(o=>o.d===year(v.d)),txt=copyDate(v.d)+' 本日'+(W[v.c]||'-')+' 前年'+(W[p?.c]||'-');return '<div class="row copyrow" data-copy="'+txt+'"><b>'+fmt(v.d)+'</b><div><b>'+(W[v.c]||'-')+'</b><br>'+v.hi+' / '+v.lo+'℃<br><span class="muted">'+v.p+'mm</span></div><div><b>'+(W[p?.c]||'-')+'</b><br>'+(p?.hi??'-')+' / '+(p?.lo??'-')+'℃<br><span class="muted">'+(p?.p??'-')+'mm</span></div></div>'}).join('');out.innerHTML='<div class="muted">'+g.name+'</div><div class="cmp">'+card(x,'指定日')+card(y,'1年前')+'</div><div class="card"><div class="copyhint">↓ 指定日から先を表示。行をタップでコピー</div><div class="row head"><span>日付</span><span>選択年</span><span>1年前</span></div>'+rows+'</div>';document.querySelectorAll('.copyrow').forEach(r=>r.onclick=()=>copyText(r.dataset.copy))}catch(e){out.innerHTML='<div class="card err">'+e.message+'</div>'}}$('#d').value=iso(new Date());$('#b').onclick=go;$('#d').onchange=go;go();</script></body></html>
